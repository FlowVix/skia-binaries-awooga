name: skia-binaries

on: workflow_dispatch

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
                    - {
                          os: ubuntu-22.04-arm,
                          target: aarch64-unknown-linux-gnu,
                      }
                    - { os: macos-15, target: aarch64-apple-darwin }
                    - { os: macos-15, target: x86_64-apple-darwin }
                    - { os: windows-2022, target: x86_64-pc-windows-msvc }
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write
        env:
            FORCE_SKIA_BUILD: "1"
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Install build tools (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y clang ninja-build libfontconfig1-dev libfreetype-dev
            - name: Install build tools (macOS)
              if: runner.os == 'macOS'
              run: brew install ninja
            - name: Install build tools (Windows)
              if: runner.os == 'Windows'
              run: |
                  choco upgrade llvm -y
                  choco install ninja -y

            - name: Build
              run: cargo build --release --target ${{ matrix.target }}
              env:
                  BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ runner.temp }}/skia-out

            - name: Package
              shell: bash
              run: |
                  cd "$RUNNER_TEMP/skia-out"
                  KEY=$(cat skia-binaries/key.txt)
                  echo "Binary key: $KEY"
                  tar -czf "skia-binaries-$KEY.tar.gz" skia-binaries
                  echo "ASSET=$RUNNER_TEMP/skia-out/skia-binaries-$KEY.tar.gz" >> "$GITHUB_ENV"

            - name: Upload to the skia-binaries release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release view skia-binaries >/dev/null 2>&1 \
                    || gh release create skia-binaries --title "Skia binaries" --notes "Prebuilt skia-bindings" \
                    || true
                  gh release upload skia-binaries "$ASSET" --clobber
